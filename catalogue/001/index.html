<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  :root {
    --ink: #2b2723;
    --muted: #8a8279;
    --line: #b7aea4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9e6e1; }
  body { font-family: "Jost", Helvetica, Arial, sans-serif; color: var(--ink); }

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    margin: 10mm auto;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0,0,0,.12);
    page-break-after: always;
    break-after: page;
  }
  @media print {
    html, body { background: #fff; }
    .page { margin: 0; box-shadow: none; }
  }

  /* Page 1 — ambience */
  .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Page 2 — views, code, dimensions */
  .view { position: absolute; }
  .view img { display: block; width: 100%; height: auto; }
  .view::before {            /* suspension cord up to the top edge */
    content: "";
    position: absolute;
    left: 48%;
    bottom: 99%;
    width: 0.6px;
    height: 400mm;
    background: #c9c2b9;
  }
  .view.unlit { left: 22mm; top: 62mm; width: 100mm; }
  .view.lit   { left: 116mm; top: 150mm; width: 76mm; }

  .dim { position: absolute; color: var(--muted); font-size: 7.5pt; font-weight: 300; letter-spacing: .08em; }
  .dim .rule { position: absolute; background: var(--line); }
  .dim .tick { position: absolute; background: var(--line); }
  .dim span { position: absolute; white-space: nowrap; }

  /* width: spans unlit body */
  .dim.d { left: 22mm; top: 156mm; width: 100mm; height: 6mm; }
  .dim.d .rule { left: 0; right: 0; top: 3mm; height: 0.5px; }
  .dim.d .tick { top: 1.5mm; width: 0.5px; height: 3mm; }
  .dim.d .tick.a { left: 0; } .dim.d .tick.b { right: 0; }
  .dim.d span { left: 50%; top: 4.6mm; transform: translateX(-50%); }

  /* height: spans unlit body */
  .dim.h { left: 12mm; top: 62mm; width: 6mm; height: 87.3mm; }
  .dim.h .rule { top: 0; bottom: 0; left: 3mm; width: 0.5px; }
  .dim.h .tick { left: 1.5mm; height: 0.5px; width: 3mm; }
  .dim.h .tick.a { top: 0; } .dim.h .tick.b { bottom: 0; }
  .dim.h span { left: -1.6mm; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }

  .spec { position: absolute; left: 22mm; bottom: 24mm; }
  .spec .code {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 300;
    font-size: 54pt;
    line-height: 1;
    letter-spacing: .04em;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1;
  }
  .spec .size {
    margin-top: 4mm;
    padding-top: 3.5mm;
    border-top: 0.5px solid var(--line);
    font-size: 9pt;
    font-weight: 300;
    letter-spacing: .18em;
    color: var(--muted);
  }
</style>
</head>
<body>

<section class="page hero">
  <img src="assets/001-ambience.jpg" alt="001 pendant lamp lit in a dining space">
</section>

<section class="page">
  <div class="view unlit"><img src="assets/001-view-unlit.png" alt="001 pendant, unlit"></div>
  <div class="view lit"><img src="assets/001-view-lit.png" alt="001 pendant, lit"></div>

  <div class="dim h"><div class="rule"></div><div class="tick a"></div><div class="tick b"></div><span>H 300 mm</span></div>
  <div class="dim d"><div class="rule"></div><div class="tick a"></div><div class="tick b"></div><span>D 360 mm</span></div>

  <div class="spec">
    <div class="code">001</div>
    <div class="size">D 360 mm &nbsp;×&nbsp; H 300 mm</div>
  </div>
</section>

</body>
</html>
